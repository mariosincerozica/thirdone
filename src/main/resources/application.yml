# ==========================================
# 1. Configurações Globais (Comuns a todos os perfis)
# ==========================================
spring:
  application:
    name: thirdone # Defina o nome do seu projeto aqui

---
# ==========================================
# 2. Perfil de Desenvolvimento (dev)
# ==========================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://192.168.100.237:5432/testdb
    username: auth
    password: auth
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
---
# ==========================================
# Configurações Globais e OpenTelemetry
# ==========================================
spring:
  application:
    name: thirdone

otel:
  resource:
    attributes:
      service.name: thirdone
  exporter:
    otlp:
      # Aponta para o IP da sua VM e a porta gRPC (4317) do OpenTelemetry Collector
      endpoint: "http://192.168.100.237:4317"
      logs:
        endpoint: "http://192.168.100.237:4317"
      protocol: grpc
  metrics:
    exporter: otlp
    protocol: grpc
  logs:
    exporter: otlp
    protocol: grpc
  traces:
    exporter: otlp
    protocol: grpc
---
# ==========================================
# 3. Perfil de Produção (prod - Exemplo seguro)
# ==========================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:prod_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Em produção, nunca use update!
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
management:
  server:
    port: 8081 # Opcional: isola o Actuator em outra porta (recomendado em produção)
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
