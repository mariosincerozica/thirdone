# Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:testdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Criação/Atualização automática das tabelas, colunas e atributos pelo JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Exibir os comandos SQL gerados no console
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Dialeto do PostgreSQL (opcional no Spring Boot 3+, mas recomendado para precisão)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Actuator & Métricas (OpenTelemetry)
# ==========================================
management.endpoints.web.exposure.include=health,metrics,prometheus,info
# Envia métricas do Actuator para o OTel Collector se desejar
management.otlp.metrics.export.url=http://localhost:4317

# ==========================================
# Padrão de Logs
# ==========================================
logging.pattern.level=%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]
