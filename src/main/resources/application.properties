# Configurações de Conexão com o Banco de Dados
spring.datasource.url=jdbc:postgresql://192.168.100.237:5432/testdb
spring.datasource.username=auth
spring.datasource.password=auth
spring.datasource.driver-class-name=org.postgresql.Driver

# Criação/Atualização automática das tabelas, colunas e atributos pelo JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update

# Exibir os comandos SQL gerados no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do PostgreSQL (opcional no Spring Boot 3+, mas recomendado para precisão)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
