name: Deploy thirdone to Minikube (ikn-pre)

on:
  workflow_dispatch: {}

env:
  APP_NAME: thirdone
  APP_VERSION: 1.0.1
  K8S_NAMESPACE: ikn-pre

jobs:
  deploy-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Minikube and kubectl access
        run: |
          minikube status
          kubectl cluster-info

      - name: Build Java 25 image inside Minikube daemon
        run: |
          #eval $(minikube -p minikube docker-env)
          docker build -t ${APP_NAME}:${APP_VERSION} .

      - name: Deploy thirdone to ikn-pre
        run: |
          kubectl apply -f k8s/deployment-service.yaml
          kubectl rollout restart deployment/${APP_NAME} -n ${K8S_NAMESPACE}
          kubectl rollout status deployment/${APP_NAME} -n ${K8S_NAMESPACE} --timeout=120s