apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdone
  namespace: ikn-pre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdone
  template:
    metadata:
      labels:
        app: thirdone
    spec:
      containers:
        - name: thirdone
          image: thirdone:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: thirdone-config
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: "thirdone"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.default.svc.cluster.local:4317"
exporters:
  elasticsearch:
    # mantenha aqui endpoints, TLS e autenticação existentes
    logs_index: "otel-logs-spring"
    traces_index: "otel-traces-thirdone"
    metrics_index: "otel-metrics-thirdone"

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [elasticsearch]
    traces:
      receivers: [otlp]
      exporters: [elasticsearch]
    metrics:
      receivers: [otlp]
      exporters: [elasticsearch]